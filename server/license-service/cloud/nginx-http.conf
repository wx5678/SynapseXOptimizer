# Bootstrap only: never serve the admin or licensing API over plaintext.
server {
    listen 80 default_server;
    server_name 39.96.195.192;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/synapsex-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://39.96.195.192$request_uri; }
}
