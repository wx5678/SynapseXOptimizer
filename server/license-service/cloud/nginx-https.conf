limit_req_zone $binary_remote_addr zone=synapsex_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=synapsex_connections:10m;

server {
    listen 80 default_server;
    server_name 39.96.195.192;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/synapsex-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://39.96.195.192$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 39.96.195.192;
    if ($host != 39.96.195.192) { return 421; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/39.96.195.192/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/39.96.195.192/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SynapseXTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    limit_req zone=synapsex_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn synapsex_connections 20;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    # Application audit handles business events without logging tokens/request bodies.
    access_log off;
    error_log /var/log/nginx/synapsex-error.log warn;

    location = / { return 302 /admin/; }
    location = /admin { return 308 /admin/; }
    location = /admin/api/product {
        client_max_body_size 384k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host 39.96.195.192;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
    location ~ ^/(admin/|v1/|healthz$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host 39.96.195.192;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
    }
    location / { return 404; }
}
